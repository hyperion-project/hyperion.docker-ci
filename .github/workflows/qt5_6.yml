name: GitHub Packages Qt5/6 Builds

on:
  # Reusable from package.yml
  workflow_call:
    inputs:
      distribution:
        type: string
        default: 'ubuntu'
        required: false
      codename:
        type: string
        default: 'jammy'
        required: false
      qt_version:
        type: string
        default: '6'
        required: false
      target_platform:
        type: string
        default: "['amd64']"
        required: false

env:
  SECRET_DOCKER_CI: ${{ secrets.DOCKER_CI }}
  REPOSITORY: hyperion-project
  CMAKE_VERSION: 3.31.6

jobs:

  build_and_push:
    name: 👷 Build ${{ matrix.target_platform }}
    runs-on: ${{ matrix.target_platform == 'amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm' }}
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    strategy:
      fail-fast: false
      matrix:
        target_platform: ${{ fromJson(inputs.target_platform) }}
        target_lookup: [{ 'amd64': 'linux/amd64', 'arm64': 'linux/arm64', 'armv6': 'linux/arm/v6', 'armv7': 'linux/arm/v7' }]
        isBullseyeQt6:
          - ${{ inputs.distribution == 'debian' && inputs.codename == 'bullseye' && inputs.qt_version == '6' }}
        exclude:
          - isBullseyeQt6: true
            target_platform: 'armv6'

    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v6

      - name: ✅ Determine current Repository
        if: ${{ !startsWith(github.repository, env.REPOSITORY) }}
        run: echo "REPOSITORY=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: 🔧 Set up QEMU (armv6 only)
        if: ${{ matrix.target_platform == 'armv6' }}
        uses: docker/setup-qemu-action@v3

      - name: 🍓 Build Raspbian base image (armv6 only)
        if: ${{ matrix.target_platform == 'armv6' }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends debuerreotype debootstrap gnupg qemu-user-static xz-utils

          WORKDIR="$(mktemp -d /tmp/raspbian-build.XXXXXXXX)"

          wget -O "${WORKDIR}/raspbian-archive-keyring.pgp.asc" "https://archive.raspbian.org/raspbian.public.key"
          gpg --batch --no-default-keyring --keyring "/usr/share/keyrings/raspbian-archive-keyring.pgp" --import "${WORKDIR}/raspbian-archive-keyring.pgp.asc"

          wget -O "${WORKDIR}/Release.gpg" "http://archive.raspbian.org/raspbian/dists/${{ inputs.codename }}/Release.gpg"
          wget -O "${WORKDIR}/Release" "http://archive.raspbian.org/raspbian/dists/${{ inputs.codename }}/Release"
          gpgv --keyring /usr/share/keyrings/raspbian-archive-keyring.pgp "${WORKDIR}/Release.gpg" "${WORKDIR}/Release"

          sudo debuerreotype-init --arch "armhf" --non-debian --keyring "/usr/share/keyrings/raspbian-archive-keyring.pgp" --no-merged-usr "${WORKDIR}/rootfs" "${{ inputs.codename }}" "http://raspbian.raspberrypi.org/raspbian/"
          sudo debuerreotype-minimizing-config "${WORKDIR}/rootfs"
          sudo debuerreotype-tar "${WORKDIR}/rootfs" "${WORKDIR}/rootfs.tar.xz"
          sudo chown "$(id -u):$(id -g)" "${WORKDIR}/rootfs.tar.xz"

          xzcat "${WORKDIR}/rootfs.tar.xz" | docker import --platform "linux/arm/v6" --change 'CMD ["/bin/bash"]' - raspbian:${{ inputs.codename }}
          docker image tag raspbian:${{ inputs.codename }} localhost:5000/raspbian:${{ inputs.codename }}
          docker image push localhost:5000/raspbian:${{ inputs.codename }}

          sudo rm -rf "${WORKDIR}"

      - name: 🐳 Set up Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPOSITORY }}/${{ inputs.distribution }}
          tags: ${{ inputs.qt_version == '6' && format('{0}-qt6', inputs.codename) || inputs.codename }}
          labels: |
            org.opencontainers.image.description=Compilation environment to build Hyperion for ${{ inputs.distribution }} ${{ inputs.codename }}
            org.opencontainers.image.vendor=Hyperion Project
            org.opencontainers.image.authors=Hyperion Team
            org.opencontainers.image.url=${{ github.server_url }}/${{ env.REPOSITORY }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ env.REPOSITORY }}/hyperion.docker-ci
            org.opencontainers.image.documentation=https://docs.hyperion-project.org
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=Compilation environment to build Hyperion for ${{ inputs.distribution }} ${{ inputs.codename }}
            org.opencontainers.image.vendor=Hyperion Project
            org.opencontainers.image.authors=Hyperion Team
            org.opencontainers.image.url=${{ github.server_url }}/${{ env.REPOSITORY }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ env.REPOSITORY }}/hyperion.docker-ci
            org.opencontainers.image.documentation=https://docs.hyperion-project.org
            org.opencontainers.image.licenses=MIT

      - name: 🔑 Login to GitHub Container Registry
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_CI }}

      - name: 👷 Build and 🚀 Push digest to GitHub Container/Package Registry
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target_platform == 'armv6' && 'debian-armv6' || inputs.distribution == 'fedora' && 'fedora' || 'ubuntu_debian' }}
          platforms: ${{ matrix.target_lookup[format('{0}',matrix.target_platform)] }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ env.REPOSITORY }}/${{ inputs.distribution }},push-by-digest=true,name-canonical=true,push=true
          build-contexts: ${{ matrix.target_platform == 'armv6' && format('raspbian:{0}=docker-image://localhost:5000/raspbian:{0}', inputs.codename) || '' }}
          build-args: |
            DIST=${{ inputs.distribution }}
            SUITE=${{ inputs.codename }}
            QT_VERSION=${{ inputs.qt_version }}
            REPOSITORY="${{ github.server_url }}/${{ env.REPOSITORY }}"
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}

      - name: ⬇ Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 📦 Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.distribution }}-${{ inputs.codename }}-qt${{ inputs.qt_version }}-${{ matrix.target_platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 👷 Merge and 🚀 Push
    needs: build_and_push
    runs-on: ubuntu-22.04

    steps:
      - name: 💾 Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: ${{ inputs.distribution }}-${{ inputs.codename }}-qt${{ inputs.qt_version }}-*
          merge-multiple: true

      - name: ✅ Determine current Repository
        if: ${{ !startsWith(github.repository, env.REPOSITORY) }}
        run: echo "REPOSITORY=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Set up Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPOSITORY }}/${{ inputs.distribution }}
          tags: ${{ inputs.qt_version == '6' && format('{0}-qt6', inputs.codename) || inputs.codename }}
          labels: |
            org.opencontainers.image.description=Compilation environment to build Hyperion for ${{ inputs.distribution }} ${{ inputs.codename }}
            org.opencontainers.image.vendor=Hyperion Project
            org.opencontainers.image.authors=Hyperion Team
            org.opencontainers.image.url=${{ github.server_url }}/${{ env.REPOSITORY }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ env.REPOSITORY }}/hyperion.docker-ci
            org.opencontainers.image.documentation=https://docs.hyperion-project.org
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=Compilation environment to build Hyperion for ${{ inputs.distribution }} ${{ inputs.codename }}
            org.opencontainers.image.vendor=Hyperion Project
            org.opencontainers.image.authors=Hyperion Team
            org.opencontainers.image.url=${{ github.server_url }}/${{ env.REPOSITORY }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ env.REPOSITORY }}/hyperion.docker-ci
            org.opencontainers.image.documentation=https://docs.hyperion-project.org
            org.opencontainers.image.licenses=MIT

      - name: 🔑 Login to GitHub Container Registry
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_CI }}

      - name: 📝 Create manifest list and 🚀 Push to GitHub Container/Package Registry
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf 'ghcr.io/${{ env.REPOSITORY }}/${{ inputs.distribution }}@sha256:%s ' *)

      - name: 👀 Inspect image
        run: |
          docker buildx imagetools inspect ${{ steps.meta.outputs.tags }}
